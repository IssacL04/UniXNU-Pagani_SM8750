name: Pagani A830 Metal candidate
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: HTTPS URL of the encrypted source and firmware bundle
        required: true
        type: string
      bundle_sha256:
        description: SHA-256 of the encrypted bundle
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oneplus13t-metal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: bootstrap
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact candidate sources and private inputs
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          PAGANI_METAL_BUNDLE_KEY: ${{ secrets.PAGANI_METAL_BUNDLE_KEY }}
        run: |
          test -n "$PAGANI_METAL_BUNDLE_KEY"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/metal.enc" "$BUNDLE_URL"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          expected = os.environ['BUNDLE_SHA256']
          assert re.fullmatch('[0-9a-f]{64}', expected)
          assert hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP']) / 'metal.enc').read_bytes()).hexdigest() == expected
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PAGANI_METAL_BUNDLE_KEY \
            -in "$RUNNER_TEMP/metal.enc" -out "$RUNNER_TEMP/metal.tar.gz"
          python3 bootstrap/scripts/package-metal-ci.py restore --bundle "$RUNNER_TEMP/metal.tar.gz" --workspace source
      - name: Install build tools and check SDK
        run: |
          brew install cmake ninja unifdef llvm mtools openssl@3 dtc glslang shaderc spirv-tools bison flex rustup
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Resolve isolated Metal profile
        working-directory: source/UniXNU
        run: |
          python3 ../UniXNU-Pagani_SM8750/scripts/prepare-metal-profile.py --soc ../UniXNU-sm8750-common
          ./unixnu defconfig oneplus13t_metal_defconfig -D ../UniXNU-Pagani_SM8750/.cache/metal-device
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          ./unixnu tree
          OUTPUT="$PWD/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal"
          mkdir -p "$OUTPUT/logs"
          echo "UNIXNU_OUTDIR=$OUTPUT" >> "$GITHUB_ENV"
          echo "UNIXNU_TREE=$OUTPUT/tree" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/scripts" >> "$GITHUB_ENV"
          ./unixnu status --json > "$OUTPUT/status.json"
      - name: Check A830 and baseline display/input contracts
        working-directory: source/UniXNU
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 ../UniXNU-Pagani_SM8750/scripts/test-metal-profile.py
          python3 ../UniXNU-Pagani_SM8750/scripts/test-gpu-firmware.py
          python3 ../UniXNU-Pagani_SM8750/scripts/check-gmu.py
          python3 scripts/check-adreno-a830.py
          python3 ../UniXNU-Pagani_SM8750/scripts/test-stage7.py --tree "$UNIXNU_TREE"
          python3 ../UniXNU-Pagani_SM8750/scripts/test-peripherals.py --tree "$UNIXNU_TREE"
      - name: Prepare original ABI, storage and trust inputs
        working-directory: source/UniXNU
        run: |
          ./unixnu ipsw fetch AppleLogo KernelCache OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee "$UNIXNU_OUTDIR/logs/ipsw.log"
          python3 "$UNIXNU_TREE/scripts/audit-stage7-display.py" out/ipsw/21H461/kernelcache.decompressed
          python3 ../UniXNU-Pagani_SM8750/scripts/prepare-ufs-policies.py --tree "$UNIXNU_TREE" \
            --inputs out/ipsw/21H461 --openssl-prefix "$(brew --prefix openssl@3)"
          python3 ../UniXNU-Pagani_SM8750/scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" \
            --inputs out/ipsw/21H461 --output "$UNIXNU_OUTDIR/original-static-system.bundle"
      - name: Prepare volatile Data
        id: data
        working-directory: source/UniXNU
        run: |
          sudo "$(command -v python3)" ../UniXNU-Pagani_SM8750/scripts/prepare-ram-data.py --tree "$UNIXNU_TREE" \
            --source out/ipsw/21H461/044-76040-038.dmg --systemos out/ipsw/21H461/044-76034-038.dmg \
            --output "$UNIXNU_OUTDIR/ram-data" --config "$UNIXNU_OUTDIR/.config"
      - name: Build and prelink XNU with the A830 runtime
        working-directory: source/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu kernel -j 3 2>&1 | tee "$UNIXNU_OUTDIR/logs/kernel.log"
      - name: Build and stage A830 Metal
        if: ${{ !cancelled() && steps.data.outcome == 'success' }}
        working-directory: source/UniXNU
        run: |
          python3 ../UniXNU-Pagani_SM8750/scripts/build-metal-userspace.py --tree "$UNIXNU_TREE" \
            --data "$UNIXNU_OUTDIR/ram-data/data.dbrdisk" --original-trust "$UNIXNU_OUTDIR/original-static-system.bundle" \
            --output "$UNIXNU_OUTDIR/metal" 2>&1 | tee "$UNIXNU_OUTDIR/logs/metal.log"
      - name: Collect build identity and diagnostics
        if: always()
        working-directory: source/UniXNU
        run: |
          if test -n "$UNIXNU_OUTDIR"; then
            test ! -f "$UNIXNU_OUTDIR/.config" || cp "$UNIXNU_OUTDIR/.config" "$UNIXNU_OUTDIR/candidate.config"
            for log in "$UNIXNU_TREE"/.cache/mesa-tu-*.log; do
              test ! -f "$log" || cp "$log" "$UNIXNU_OUTDIR/logs/"
            done
          fi
      - name: Upload candidate build outputs for local boot packaging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13t-metal-${{ github.run_number }}
          path: |
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/kernel/**
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/logs/**
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/metal/**
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/status.json
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/candidate.config
            source/UniXNU/out/oneplus13t/ipados-17.7.11-21H461/oneplus13t_metal/ram-data/seed.json
          if-no-files-found: warn
          retention-days: 7
