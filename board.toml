[board]
name = "oneplus13t"
soc = "SM8750"
description = "OnePlus 13T PKX110: Stage 6 verified read-only root startup"
kit = "oneplus13t"

# iPadOS root-image source; hardware identity remains the OnePlus 13T.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "oneplus13t_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-platform.py",
  "build-native-aes.py",
  "build-native-ufs.py --root-windows",
  "build-ufs-storage-bindings.py --kernelcache ../../ipsw/21H461/kernelcache.decompressed",
  "build-native-ufs.py --component NativeVirtioBlock --root-windows",
  "build-native-ufs.py --component NativeRamBlock --root-windows",
  "build-sheng-platform-power.py --kernelcache ../../ipsw/21H461/kernelcache.decompressed",
  "build-verified-root-probe.py --component os --include-systemos",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.iokit.IOStorageFamily", "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity", "com.apple.kext.CoreTrust",
  "com.apple.security.sandbox", "com.apple.driver.ApplePMGR",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
]

[payload]
volume = "UNIXNU13T"
size_mib = 160
loader = "firmware"
title = "OnePlus 13T Stage 6: verified root startup (read only)"
dram_size = "0x20000000"
timeout = 10
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1", "-enable_kprintf_spam", "kt_fixed_zones=240", "native-ufs-root=1", "native-ufs-diagnostics=1", "sheng-pmgr=2", "offline-apfs-load=1", "startup_debug=0"]
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]

[payload.adt]
packed_data_ramdisk = true
tool = "scripts/make-oneplus13t-adt.py"
owned_memory_size = "0x20000000"
cpu_regs = "0"
# OS IOMedia UUID confirmed by the mode 12 hardware report.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[bootimg]
# This ABL loads init_boot's ramdisk even during fastboot boot.
embed_payload = true

# PKX110 primary and backup GPT read back on 2026-10-22: 64 GiB on LUN 0.
# The output filename remains userdata-root.img; deployment targets unixnu only.
[userdata]
partition = "unixnu"
first_lba = 44928768
last_lba = 61705983
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
patches = ["Resources/MuPatches/OnePlus13T.patch"]
config = "oneplus13t"
dsc = "Platforms/OnePlus/oneplus13tPkg/oneplus13t.dsc"
fd = "Build/oneplus13tPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "oneplus13t"
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "oneplus13t-xnu-early-progress-20261021"
