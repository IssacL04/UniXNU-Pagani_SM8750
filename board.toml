[board]
name = "oneplus13t"
soc = "SM8750"
description = "OnePlus 13T PKX110: Stage 6 read-only UFS bring-up"
kit = "oneplus13t"

[kernel]
defconfig = "oneplus13t_defconfig"
# First reach the platform expert without importing Apple's device drivers.
source_only = true
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-platform.py",
  "build-native-ufs.py",
]

[payload]
volume = "UNIXNU13T"
size_mib = 64
loader = "firmware"
title = "OnePlus 13T Stage 6: UFS registers (read only)"
dram_size = "0x10000000"
timeout = 10
# The source-only kernel needs 33 slots at the default 260-zone budget; 240 needs 30.
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1", "-enable_kprintf_spam", "kt_fixed_zones=240", "native-ufs-probe=2", "native-ufs-diagnostics=1"]

[payload.adt]
tool = "scripts/make-oneplus13t-adt.py"
owned_memory_size = "0x10000000"
cpu_regs = "0"

[bootimg]
# This ABL loads init_boot's ramdisk even during fastboot boot.
embed_payload = true

# PKX110 primary and backup GPT read back on 2026-10-22: 64 GiB on LUN 0.
# The output filename remains userdata-root.img; deployment targets unixnu only.
[userdata]
partition = "unixnu"
first_lba = 44928768
last_lba = 61705983
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
patches = ["Resources/MuPatches/OnePlus13T.patch"]
config = "oneplus13t"
dsc = "Platforms/OnePlus/oneplus13tPkg/oneplus13t.dsc"
fd = "Build/oneplus13tPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "oneplus13t"
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "oneplus13t-xnu-early-progress-20261021"
