schema_version = 1

[device]
name = "oneplus13t"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 13T PKX110: format-2 migration of the single-core, read-only UFS root and CPU display port; volatile RAM Data."

[[area]]
id = "configuration"
status = "implemented"
components = ["PaganiArmDTPlatform", "NativeAES", "NativeKeyStoreEvents"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "upstream.rev", "unixnu.lock", "drivers/*", "kits/*", "modules/*", "scripts/test-format2.py", "scripts/fixtures/**", "local.toml.example", "unixnu", "scripts/test-layout.py", "scripts/test-upstream.py", "scripts/prepare-xnu-source.py", "scripts/build-*.py", "scripts/build-*.sh", "scripts/audit-stage7-display.py", "scripts/original_stage7.py", "patches/unixnu-framework.patch"]
inputs = ["Four layers: ARM64, pinned sm8750, ipados-17.7.11-21H461, OnePlus 13T. Arrays are complete replacements."]
configuration = ["schema_version=2; soc_source=sm8750; complete component/fragment/archive arrays; configs/oneplus13t_defconfig."]
procedure = ["From UniXNU: defconfig oneplus13t_defconfig -D ../UniXNU-Pagani_SM8750; fetch; status --json; tree; run scripts/test-format2.py with the main scripts on PYTHONPATH."]
findings = ["Four layers: ARM64, pinned sm8750, ipados-17.7.11-21H461, OnePlus 13T. Arrays are complete replacements.", "Community sources share one gitlink; official module names are not substituted based only on a legacy name. CI creates the resolved logs directory before the first tee. Archive builders import the board-selected prelink library; the AES helper receives the community object directory and publishes the declared archive name."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The main fork carries community catalog entries; stock upstream alone cannot resolve this selection."]
next_action = ["Build the migrated pinned sources, inspect host artifacts, then request a separate temporary-boot test and record its exact image revision."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Current format-2 selection and board policy." },
  { kind = "source", reference = "STAGE6.md", result = "Historical PKX110 observations through build 39; no claim of migrated-image hardware verification." },
]

