paths = ["dts/**", "scripts/test-kernel-source.py"]
inputs = ["Captured MPIDR affinities: 0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000, 0x10100; PSCI SMC. GICD=0x16000000, GICR=0x16080000, stride=0x40000, CNTFRQ=19200000."]
configuration = ["Eight board CPU nodes enabled; cpus=8, sheng-smp=1, sheng-smp-gic=1, armcpu-self-ipi=1; XNU_NATIVE_ARCH_TIMER and XNU_NATIVE_PAN enabled."]
procedure = ["Run test-format2.py against the selected patched XNU source, test-kernel-source.py and production assembly/console checks; build the exact pinned kernel before a separately authorized temporary boot."]
findings = ["The build-57 baseline enabled only MPIDR affinity 0. GICD=0x16000000/0x10000, GICR=0x16080000/0x200000, stride=0x40000, CNTFRQ=19200000.", "The counter conversion uses the firmware CNTFRQ; the shared ARM64 patch preserves the Stage-6 timer correction. The source-kernel suite also executes the real RAMBlock link section with an alternate archive directory.", "The candidate enables all eight captured affinities with PSCI SMC, Aff1 core/Aff2 cluster mapping, eight CPU/two cluster capacity and full-affinity reset/lookup checks. Secondary CPUs install normal XNU exception vectors after MMU setup. Shared counters are atomic; remote redistributor preparation and self IPI are enabled. Host topology and console tests are required; eight-core timer/IPI operation remains unverified."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["SMP, other CPU affinities and CPU frequency control are unverified."]
