schema_version = 1

[device]
name = "oneplus13t"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 13T PKX110: format-2 migration of the single-core, read-only UFS root and CPU display port; volatile RAM Data."

[[area]]
id = "configuration"
status = "host-verified"
components = ["PaganiArmDTPlatform", "NativeAES", "NativeKeyStoreEvents"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "upstream.rev", "unixnu.lock", "drivers/*", "kits/*", "modules/*", "scripts/test-format2.py", "scripts/fixtures/**", "local.toml.example", "unixnu", "scripts/test-layout.py", "scripts/test-upstream.py", "scripts/prepare-xnu-source.py", "scripts/build-*.py", "scripts/build-*.sh", "scripts/audit-stage7-display.py", "scripts/original_stage7.py", "patches/unixnu-framework.patch"]
inputs = ["Four layers: ARM64, pinned sm8750, ipados-17.7.11-21H461, OnePlus 13T. Arrays are complete replacements."]
configuration = ["schema_version=2; soc_source=sm8750; complete component/fragment/archive arrays; configs/oneplus13t_defconfig."]
procedure = ["From UniXNU: defconfig oneplus13t_defconfig -D ../UniXNU-Pagani_SM8750; fetch; status --json; tree; run scripts/test-format2.py with the main scripts on PYTHONPATH."]
findings = ["Four profiles select 18 components. PaganiInput and PaganiPanel are embedded in the ABI-qualified display archive and depend on QcomGeniSpi plus Sm8750Platform. Build 48 passed the complete configuration checks, driver compilation, final kernel link and prelink. Its source pins are device e6435b2bda6e91431f3bc0c442d1ff9c47be1451, main 42ffa07e9b82f7ffc37499392b2751e146647a6a, drivers 143e958bea8ae8ad7f47723cd105a589084f913d and SoC 9e90b16861612c0251c453ccbf6cf10592ea87e2.", "The documentation workflow checks out pinned driver submodules so repository-relative evidence links resolve during validation. Current pins include the UFS completion recheck. Build 49 passed cloud regressions, full kernel link and prelink; its matching boot image passed local assembly and readback. Build-49 hardware feedback is recorded below.", "Official UniXNU ae68700 is merged with the maintained 13T catalog. The J120AP/product-id identity and all selected XNU patches pass the updated format-2 contract. Build 49 was temporarily booted; the user reported no repeat panic during the observed test. Build 50 includes Setup completion preferences, upstream HID collection ordering and retained peripheral diagnostics. Cloud compilation, original/compiled ABI checks, full link/prelink and matching image readback passed; fastboot accepted the temporary boot, with runtime feedback pending.", "Build-50 hardware feedback confirms the lock screen after skipping Setup and working short/long power-key actions. Touch failed during TouchComm startup. Build 51 corrects SPI read bytes, detects v1/v2 and retains detailed protocol diagnostics below the camera cutout. Portable and cloud regressions, full compilation/link/prelink and matching image readback passed; fastboot accepted the temporary boot, with touch behavior awaiting observation.", "Build-51 hardware feedback reports first-transfer SPI timeout (T0 00 header, r=ffffff92, v=0, n=0). The next candidate exposes the existing pre-cancel GENI snapshot; its adapter and overlay regressions pass. Full compilation of this diagnostic update is pending.", "Build 52 reached input object compilation but the early-console dependency check rejected a compiler-generated bzero from the five-row stack snapshot. The renderer now copies one 80-byte row at a time. ARM64 automatic-initialization reproduction and host display/panic checks pass; build 53 subsequently passed the full production object and final kernel build.", "Build-53 feedback confirms GENI FIFO_IF_DISABLE=1 and a first-read timeout. The next candidate selects existing SE DMA for FIFO-disabled engines and supplies the board SMMU extent. Local transport, overlay and both SMMU build variants pass; full compilation and hardware DMA remain pending.", "Build 54 passed all component contracts, regressions, full compilation/link/prelink and image readback. Source pins: device fba1472, main 1397e2d, drivers 26a32f5, SoC b6706a5. Fastboot accepted the temporary boot; hardware DMA/touch feedback is pending.", "Build-54 hardware feedback reports T0 00 header r=ffffffb9 v=0 n=0 with no SPI error rows. The next candidate retains the first successful RX/header, GPIO levels and DMA counts. Local actual-adapter and overlay regressions pass; its full kernel build is pending.", "Build 55 passed all 18 component contracts, regressions, original/compiled ABI checks, full compilation/link/prelink and matching image readback. Source pins: device 664530f, main b689e9a, drivers 339d4df, SoC b6706a5. Fastboot accepted the temporary boot; first-read diagnostic values and touch behavior await observation.", "Build-55 hardware feedback confirms a completed four-byte SE DMA read with TX/RX length-in 4 and idle GENI state, but all RX bytes are zero. Touch still fails with -71 before HID startup. The next investigation compares stock Android power and SPI state.", "A read-only Android 16 baseline on the local 6.6.118 kernel confirms enabled 1.8 V/3.1 V touch rails and retained SPI logs with valid a5 frames. The OnePlus driver uses cs_clk_delay=50 and inter_words_delay=0; this port does not explicitly program SE_SPI_DELAY_COUNTERS. No runtime code or build-55 image changed.", "The next touch candidate adds board-owned RPMh resource names/voltages and SPI delays, with shared checked controller operations. Actual-adapter, power fault, transport and overlay regressions pass. Full cloud compilation is pending; this round ends after downloading the kernel and matching inputs without a device boot."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The main fork carries community catalog entries; stock upstream alone cannot resolve this selection."]
next_action = ["Complete the authorized cloud build, download and verify its kernel and paired inputs, then wait for the user before any device boot or flash."]
evidence = [
  { kind = "source", reference = "STAGE6.md", result = "The next touch candidate adds board-owned RPMh resource names/voltages and SPI delays, with shared checked controller operations. Actual-adapter, power fault, transport and overlay regressions pass. Full cloud compilation is pending; this round ends after downloading the kernel and matching inputs without a device boot." },
  { kind = "device", reference = "STAGE6.md", command = "Read-only ADB root capture of Android regulator, GPIO, clock and existing SPI IPC logs; compare OnePlus touch and GENI source", revision = "bdeec6693f1b8488a3286446f0b93c13c02d6785", result = "A read-only Android 16 baseline on the local 6.6.118 kernel confirms enabled 1.8 V/3.1 V touch rails and retained SPI logs with valid a5 frames. The OnePlus driver uses cs_clk_delay=50 and inter_words_delay=0; this port does not explicitly program SE_SPI_DELAY_COUNTERS. No runtime code or build-55 image changed." },
  { kind = "device", reference = "STAGE6.md", command = "Build-55 temporary boot; user transcribed TOUCH and both SPI rows, then confirmed return code b9", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build-55 hardware feedback confirms a completed four-byte SE DMA read with TX/RX length-in 4 and idle GENI state, but all RX bytes are zero. Touch still fails with -71 before HID startup. The next investigation compares stock Android power and SPI state." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40437346840", command = "Actions build 55; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 passed all 18 component contracts, regressions, original/compiled ABI checks, full compilation/link/prelink and matching image readback. Source pins: device 664530f, main b689e9a, drivers 339d4df, SoC b6706a5. Fastboot accepted the temporary boot; first-read diagnostic values and touch behavior await observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40369222494", command = "Actions build 54; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "Build 54 passed all component contracts, regressions, full compilation/link/prelink and image readback. Source pins: device fba1472, main 1397e2d, drivers 26a32f5, SoC b6706a5. Fastboot accepted the temporary boot; hardware DMA/touch feedback is pending." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 53; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "Build 53 passed all 18 component contracts, full C/C++ compilation, early-console runtime checks, kernel link/prelink and matching image readback. Sending and Booting returned OKAY; SPI snapshot observations are pending." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 51; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Build 51 passed all 18 component contracts, full C/C++ compilation, kernel link/prelink and matching image readback. Sending and Booting returned OKAY; touch behavior awaits observation." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 50; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Build 50 passed all 18 component contracts, full kernel compilation/link/prelink, matching image assembly and actual payload readback. Sending and Booting returned OKAY; system UI and peripheral behavior await observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot stage7-run-49/boot.img; user observation", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Sending and Booting returned OKAY. The user reported no repeat panic during the test, while touch, volume/power keys and brightness remained unusable. Test duration was not specified; this does not qualify long-term stability or input." },
  { kind = "host", reference = "STAGE6.md", command = "test-format2.py; test-stage6.py; ./unixnu kernel -j 3; ./unixnu payload; ./unixnu bootimg; FAT readback", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Build 49 passed configuration, UFS regressions, complete kernel link/prelink and matching boot-image assembly/readback. The UFS completion recheck is included; hardware retest remains pending." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40183635568", command = "test-format2.py; ./unixnu status --json; ./unixnu kernel -j 3", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "All 18 selected components resolved at their pinned revisions; archive ordering, ADT checks, full kernel link and prelink passed. Downloaded kernel and report agree at 127778816 bytes; hardware remains untested." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40174199304", command = "test-format2.py; ./unixnu status --json", revision = "af2ba2975a5f0f6dcedfdcc719a1c646876f5804", result = "Four layers, 15 pinned components, complete archive order and matching required ADT properties passed." },
  { kind = "source", reference = "board.toml", result = "Current format-2 selection and board policy." },
  { kind = "source", reference = "STAGE6.md", result = "Historical PKX110 observations through build 39; no claim of migrated-image hardware verification." },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["PaganiDarwinBoot"]
paths = ["proprietary-files.txt", "patches/mu*", "patches/uefi*", "scripts/check-memory-map.py"]
inputs = ["PKX110 ABL uses init_boot ramdisk during fastboot boot; embedded payload plus the BootPayload HOB remains necessary.", "Private firmware checkout: IssacL04/UEFI-Pagani_SM8750 at 50b7313f40684aa25481cd109d7f48b9a50663fa."]
configuration = ["firmware.config=oneplus13t; firmware.packages points to PaganiDarwinBoot; bootimg.embed_payload=true."]
procedure = ["From UniXNU after kernel inputs pass: build package; firmware; payload; bootimg using ignored local input paths."]
findings = ["PKX110 ABL uses init_boot ramdisk during fastboot boot; embedded payload plus the BootPayload HOB remains necessary.", "UniXNURamDiskDxe, DiskIoDxe and FAT support the standard FDT handoff; the rebuilt FD contains both paths.", "Build 54 reused the unchanged UEFI and passed complete embedded-payload readback. The same-build kernel, trust cache and RAM Data were temporarily booted without flashing.", "Build 55 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. Actual kernel, trust cache and volatile Data match this build. Sending and Booting returned OKAY without flashing a partition.", "Android regulator state reports pm_humu_l4 enabled at 1.8 V for spi0.0-vdd and pm_humu_l16 enabled at 3.1 V for spi0.0-vcc. This is a software power-state baseline, not a physical voltage measurement or evidence that the rails remain enabled under XNU. The read-only capture used the existing debugfs mount and changed no firmware or device configuration.", "Android command DB confirms ldob4 at 0x40800 and ldob16 at 0x41900. The candidate now explicitly enables those touch rails through apps DRV-2 before reset, while retaining GENI microcode. The firmware image is unchanged; no flash or temporary boot is authorized in this build round."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Build 48 reached the UI through the existing embedded-payload path. The standard initrd driver was not separately exercised."]
next_action = ["Complete the authorized cloud build, download and verify its kernel and paired inputs, then wait for the user before any device boot or flash."]
evidence = [
  { kind = "source", reference = "STAGE6.md", result = "Android command DB confirms ldob4 at 0x40800 and ldob16 at 0x41900. The candidate now explicitly enables those touch rails through apps DRV-2 before reset, while retaining GENI microcode. The firmware image is unchanged; no flash or temporary boot is authorized in this build round." },
  { kind = "device", reference = "STAGE6.md", command = "Read-only ADB root capture of Android regulator, GPIO, clock and existing SPI IPC logs; compare OnePlus touch and GENI source", revision = "bdeec6693f1b8488a3286446f0b93c13c02d6785", result = "Android regulator state reports pm_humu_l4 enabled at 1.8 V for spi0.0-vdd and pm_humu_l16 enabled at 3.1 V for spi0.0-vcc. This is a software power-state baseline, not a physical voltage measurement or evidence that the rails remain enabled under XNU. The read-only capture used the existing debugfs mount and changed no firmware or device configuration." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40437346840", command = "Actions build 55; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. Actual kernel, trust cache and volatile Data match this build. Sending and Booting returned OKAY without flashing a partition." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40369222494", command = "Actions build 54; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "Build 54 reused the unchanged UEFI and passed complete embedded-payload readback. The same-build kernel, trust cache and RAM Data were temporarily booted without flashing." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 53; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "Build 53 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. The verified image was temporarily booted without flashing a partition." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 51; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Build 51 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. The verified image was temporarily booted without flashing a partition." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 50; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Build 50 reused the unchanged UEFI and passed Android v4, empty ramdisk, embedded FD/FAT and stock DTB packaging checks. fastboot boot returned OKAY without flashing a partition; this is not a runtime qualification." },
  { kind = "host", reference = "MIGRATION.md", command = "./unixnu build package; ./unixnu firmware", revision = "af2ba2975a5f0f6dcedfdcc719a1c646876f5804", result = "AARCH64 DEBUG package and 3145728-byte FD built locally, including UniXNURamDiskDxe and the retained embedded payload path; hardware boot remains untested." },
  { kind = "source", reference = "board.toml", result = "Current format-2 selection and board policy." },
  { kind = "source", reference = "STAGE6.md", result = "Historical PKX110 observations through build 39; no claim of migrated-image hardware verification." },
]

