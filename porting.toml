[[area]]
id = "input"
status = "device-verified"
components = ["PaganiInput", "QcomGeniSpi"]
paths = ["package/PaganiPeripherals.h", "scripts/test-peripherals.py"]
inputs = ["S3910 HBP on GENI SPI QUP1 S4 at 0xa90000, wrapper 0xac0000, mode 0, maximum 19 MHz. GPIOs 48..51 carry SPI; reset 161 and ATTN 162 are active low. TLMM GPIO windows include the SM8750 0x100000 offset.", "SPMI v7 observer: PON SID 0 peripheral 0x13, bits 7/6 = Power/Volume Up; GPIO SID 1 peripheral 0x8d bit 0 active low = Volume Down.", "Live DTB: apps-smmu at 0x15000000, size 0x100000; QUP wrapper stream 0xa3 for SE DMA. GPI uses a different stream and is not selected."]
configuration = ["pagani-touch=1 and pagani-buttons=1 select two original-ABI HID devices. Board wiring and timing are defined in PaganiPeripherals.h."]
procedure = ["Run test-peripherals.py --tree <resolved-tree> and the original HID ABI audit; build the full archive. On hardware first check SPI protocol, ID/application status and LBP/configuration acknowledgements, then single contacts, coordinate orientation, simultaneous contacts, releases and physical key holds."]
findings = ["The stock HBP driver exposes an LBP fallback through dynamic config 0x11=2. The new transport drains queued raw frames, installs and reads back a custom report format, filters palms and emits explicit releases with stable IDs. TouchComm CRC command suffixes are detected from identification.", "PMIC reads are bounded and keys use 32 ms debounce. Failed key reads release all keys; touch transport failure releases held contacts and disables further touch reads. ATTN is polled at 8 ms, keys at 16 ms. Build 48 passed portable tests, the original 207-slot HID and compiled-object ABI audits, C/C++ compilation, final link and prelink. Input, S3910 and GENI SPI symbols are present in the downloaded kernel; build-48 hardware testing found touch and volume/power keys unresponsive. Initialization status and event routing still need runtime evidence.", "Build-49 touch and keys remained unusable. Build 50 puts a keyboard application before the digitizer as in upstream NativeHidInput 5f3a37c; the physical report IDs and payload sizes remain unchanged. Retained status distinguishes HID resource/class/start failures, SPMI channel/subtype checks, SPI clock/firmware/setup, TouchComm startup and report submission.", "Build 50 confirms power-key short/long actions and increasing key report counts for volume presses. Touch stops at TouchComm start with r=ffffffb9 and n=0; its raw value is obscured by the camera. Compared with OnePlus S3910 and data-a-live S3910P, build 51 sends 0xff during full-duplex reads, supports validated v1/v2 headers, v2 CRC/ACK/RETRY/fragments, a 100 ms reset wait and detailed retained diagnostics. Host tests, full kernel build and image readback passed. The matching image was temporarily booted; the hardware fault is not yet qualified as fixed.", "Build 51 still has no touch response: T0 00 header r=ffffff92 v=0 n=0. The first four-byte full-duplex SPI transfer times out before protocol detection; v=0 is the unset header detail. The next candidate forwards GENI firmware/interface-disable and pre-cancel state/IRQ/TX/RX FIFO snapshots to two visible rows. It changes no transport mode, IRQ routing or wiring. Actual adapter and existing transport regressions pass.", "Build 53 passed full compilation/link/prelink and matching image readback; fastboot accepted the temporary boot. The pre-cancel GENI rows are present in the final kernel. No FIFO/DMA or IRQ-routing change has been made, and usable touch remains unverified.", "Build 53 remains unresponsive: TOUCH T0 00 header r=ffffff92 v=0 n=0; SPI fw=102 if=1 st=41 irq=0; SPI FIFO tx=0 rx=0. Bit 0 of if confirms FIFO disabled; bit 0 of st indicates the active master. The candidate reuses SE DMA with separate 4 KiB TX/RX buffers, explicit cache maintenance and the live-DTB QUP SID 0xa3. It refuses existing translated/shared firmware mappings and displays SMR/S2CR on refusal. DMA-exposed buffers remain allocated until reboot pending reset qualification.", "Build 54 compiled the DMA allocation/cache/SMMU adapter against the original kernel ABI and passed transport/contact/button regressions. The matching image passed local readback and fastboot boot. Whether the QUP stream is available and SE DMA works on the phone remains unverified.", "Build 54 returns success from its first SPI read, then rejects four zero header bytes with -71 before IOHIDDevice::start. No SPI error rows are expected on that path. The candidate captures the first successful read length/head, ATTN before/after, RESET GPIO low bits, DMA length-in readings and GENI status. Later protocol rejection preserves that evidence; no protocol, reset-timing or transport-mode change is made.", "Build 55 passed actual-adapter first-success retention and zero-header rejection tests, protocol/contact/button/PIO/SE DMA regressions, C/C++ compilation and original/compiled HID ABI checks. Both first-read diagnostic formats are present in the final kernel. The matching image passed readback and fastboot boot; raw RX/GPIO/counter values and usable touch remain unverified.", "Build 55 reports TOUCH T0 00 header r=ffffffb9 v=0 n=0; SPI RX n=4 h=00000000 a=0/0 rst=3; SPI dma=1 ti=4 ri=4 st=0. The RX canary is replaced by zeros and both DMA length-in readings are 4, but no valid sensor header or UI touch is obtained. ATTN is low before/after; RESET input and output latch are high. Stock Android explicitly enables ldob4 at 1.8 V and ldob16 at 3.1 V; this port still adopts retained rails, whose XNU state is unknown.", "The Android baseline uses the OnePlus HBP driver on the local 6.6.118 kernel. Retained GPI logs show ff TX, a5 23 ca 05 RX, CS delay 50 and inter-word delay 0. Idle RESET/ATTN are high and SPI is runtime suspended; live sampling captured no gesture or active interval. The current port omits an explicit SE_SPI_DELAY_COUNTERS write, but its inherited value and XNU rail state remain unknown, so timing is a candidate cause rather than a confirmed diagnosis.", "A synchronized Android gesture capture contains 40 complete press/release cycles over 18.793234 seconds, 726 frames and 51 overlapping valid SPI RX records. Following the hummer S3910 power diagnosis, the candidate validates the 13T command DB resources, requests 1800/3100 mV, waits 200 ms, and sets checked CS/word delays to 50/0 before reset. First-read diagnostics include dly; power failures preserve resource, RSC, TCS and acknowledgement state. Host regressions pass; SE DMA and protocol validation are unchanged, and XNU touch remains unverified.", "Build 56 compiled and linked the explicit 1800/3100 mV touch requests, 200 ms power wait and checked SPI delays of 50/0. The downloaded kernel contains the new diagnostics and matches all source pins and its RAM Data UUID. No XNU hardware test was performed; valid S3910 traffic and UI touch remain unverified.", "The matching build-56 image was sent with fastboot boot after the user connected the device. Sending/Booting returned OKAY; touch response and the TOUCH, SPI RX/dly or PWR diagnostic values await hardware feedback.", "Build 56 shows TOUCH HID report r=0 with count increasing (observed 430); v is nonzero while pressed and returns to zero on release. Valid protocol and parsed contact activity now reach the kernel HID API, while UI swipes and an ordinary Cancel tap fail. Current code does not observe event-driver attachment or digitizer dispatch; keyboard-first identity, downstream matching, coordinates and release delivery require investigation.", "Following the input guide, the candidate separates touchscreen Usage 13/4 from buttons, installs a Pagani S3910 SPI-only IOHIDEventDriver personality, and requires actual driver/ABI/usage/collection binding before sending. A per-instance qualified dispatch wrapper preserves edge-origin 0x800 through release and observes event counts and X/Y. Descriptor, personality, contact/edge lifecycle, bounds and existing transport/power tests pass. Ordinary taps and system gestures remain unverified.", "Build 57 compiled and linked the standalone touch descriptor, product-scoped event-driver matching, qualified per-instance dispatch and edge-origin lifecycle. The downloaded kernel contains binding/event/X/Y diagnostics and matches the pinned sources. No hardware boot was performed; binding, coordinates, ordinary taps and system gestures remain unqualified.", "The user-authorized build-57 temporary boot returned Sending/Booting OKAY. Lock-screen state, ordinary taps, swipes and the TOUCH/HID/XY rows are requested; event binding and UI delivery remain unqualified.", "The user confirmed that touch is working after the build-57 temporary boot. This is hardware evidence of basic touch response beyond build-56 accepted HID reports. No HID/XY readings or separate multi-touch, coordinate-calibration, edge-gesture, sleep/wake or long-duration results were supplied.", "After confirmed basic touch in build 57, the candidate removes pagani-peripheral-status=1 from default boot arguments. Touch transport, HID binding and coordinate handling are unchanged."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["GENI firmware is retained. Basic touch response is user-confirmed; physical rail voltage has not been measured. No GIC IRQ path, GPI DMA, v1 command fragmentation, firmware recovery or system-sleep wake. Existing translated QUP mappings are refused. The exposed 8 KiB DMA buffer and any timed-out TCS remain reserved until reboot pending reset qualification. Multi-touch, full-screen coordinate calibration, system edge gestures and long-term stability remain unqualified."]
next_action = ["Preserve build 57 as the user-confirmed basic-touch baseline; separately qualify coordinates, multi-touch, system edge gestures and stability when testing resumes."]
evidence = [
  { kind = "source", reference = "STAGE6.md", result = "After confirmed basic touch in build 57, the candidate removes pagani-peripheral-status=1 from default boot arguments. Touch transport, HID binding and coordinate handling are unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "Build-57 fastboot boot; user confirmed touch is working", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "The user confirmed that touch is working after the build-57 temporary boot. This is hardware evidence of basic touch response beyond build-56 accepted HID reports. No HID/XY readings or separate multi-touch, coordinate-calibration, edge-gesture, sleep/wake or long-duration results were supplied." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT readback; fastboot boot", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "The user-authorized build-57 temporary boot returned Sending/Booting OKAY. Lock-screen state, ordinary taps, swipes and the TOUCH/HID/XY rows are requested; event binding and UI delivery remain unqualified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40461298553", command = "Actions build 57; gh run download; kernel/source-pin and packed/raw Data verification", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "Build 57 compiled and linked the standalone touch descriptor, product-scoped event-driver matching, qualified per-instance dispatch and edge-origin lifecycle. The downloaded kernel contains binding/event/X/Y diagnostics and matches the pinned sources. No hardware boot was performed; binding, coordinates, ordinary taps and system gestures remain unqualified." },
  { kind = "source", reference = "STAGE6.md", result = "Following the input guide, the candidate separates touchscreen Usage 13/4 from buttons, installs a Pagani S3910 SPI-only IOHIDEventDriver personality, and requires actual driver/ABI/usage/collection binding before sending. A per-instance qualified dispatch wrapper preserves edge-origin 0x800 through release and observes event counts and X/Y. Descriptor, personality, contact/edge lifecycle, bounds and existing transport/power tests pass. Ordinary taps and system gestures remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-56 temporary boot; user transcribed TOUCH/SPI rows and tested press/release, both edge swipes and power-menu Cancel", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "Build 56 shows TOUCH HID report r=0 with count increasing (observed 430); v is nonzero while pressed and returns to zero on release. Valid protocol and parsed contact activity now reach the kernel HID API, while UI swipes and an ordinary Cancel tap fail. Current code does not observe event-driver attachment or digitizer dispatch; keyboard-first identity, downstream matching, coordinates and release delivery require investigation." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT readback; fastboot boot", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "The matching build-56 image was sent with fastboot boot after the user connected the device. Sending/Booting returned OKAY; touch response and the TOUCH, SPI RX/dly or PWR diagnostic values await hardware feedback." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40448445357", command = "Actions build 56; gh run download; local kernel/source-pin and packed/raw Data verification", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "Build 56 compiled and linked the explicit 1800/3100 mV touch requests, 200 ms power wait and checked SPI delays of 50/0. The downloaded kernel contains the new diagnostics and matches all source pins and its RAM Data UUID. No XNU hardware test was performed; valid S3910 traffic and UI touch remain unverified." },
  { kind = "source", reference = "STAGE6.md", result = "A synchronized Android gesture capture contains 40 complete press/release cycles over 18.793234 seconds, 726 frames and 51 overlapping valid SPI RX records. Following the hummer S3910 power diagnosis, the candidate validates the 13T command DB resources, requests 1800/3100 mV, waits 200 ms, and sets checked CS/word delays to 50/0 before reset. First-read diagnostics include dly; power failures preserve resource, RSC, TCS and acknowledgement state. Host regressions pass; SE DMA and protocol validation are unchanged, and XNU touch remains unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Read-only ADB root capture of Android regulator, GPIO, clock and existing SPI IPC logs; compare OnePlus touch and GENI source", revision = "bdeec6693f1b8488a3286446f0b93c13c02d6785", result = "The Android baseline uses the OnePlus HBP driver on the local 6.6.118 kernel. Retained GPI logs show ff TX, a5 23 ca 05 RX, CS delay 50 and inter-word delay 0. Idle RESET/ATTN are high and SPI is runtime suspended; live sampling captured no gesture or active interval. The current port omits an explicit SE_SPI_DELAY_COUNTERS write, but its inherited value and XNU rail state remain unknown, so timing is a candidate cause rather than a confirmed diagnosis." },
  { kind = "device", reference = "STAGE6.md", command = "Build-55 temporary boot; user transcribed TOUCH and both SPI rows, then confirmed return code b9", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 reports TOUCH T0 00 header r=ffffffb9 v=0 n=0; SPI RX n=4 h=00000000 a=0/0 rst=3; SPI dma=1 ti=4 ri=4 st=0. The RX canary is replaced by zeros and both DMA length-in readings are 4, but no valid sensor header or UI touch is obtained. ATTN is low before/after; RESET input and output latch are high. Stock Android explicitly enables ldob4 at 1.8 V and ldob16 at 3.1 V; this port still adopts retained rails, whose XNU state is unknown." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40437346840", command = "Actions build 55; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 passed actual-adapter first-success retention and zero-header rejection tests, protocol/contact/button/PIO/SE DMA regressions, C/C++ compilation and original/compiled HID ABI checks. Both first-read diagnostic formats are present in the final kernel. The matching image passed readback and fastboot boot; raw RX/GPIO/counter values and usable touch remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-54 temporary boot; user transcribed TOUCH row and absent SPI rows", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "TOUCH T0 00 header r=ffffffb9 v=0 n=0. SPI returned success but the protocol parser rejected a zero header; touch setup stopped before HID start. No SPI error rows appeared. Valid sensor data and UI touch remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40369222494", command = "Actions build 54; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "Build 54 compiled the DMA allocation/cache/SMMU adapter against the original kernel ABI and passed transport/contact/button regressions. The matching image passed local readback and fastboot boot. Whether the QUP stream is available and SE DMA works on the phone remains unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-53 temporary boot; user transcribed TOUCH and SPI rows", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "First four-byte SPI read still times out. fw=102 if=1 st=41 irq=0; FIFO tx=0 rx=0. FIFO interface disabled is observed; successful DMA and touch are not established." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 53; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "Build 53 passed actual SPI callback/snapshot and protocol/contact/button regressions, C/C++ compilation and original/compiled HID ABI checks. The final image contains both SPI status formats and was temporarily booted; hardware register values are pending." },
  { kind = "device", reference = "STAGE6.md", command = "Build-51 temporary boot; user transcribed TOUCH status", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Touch remains unresponsive. TOUCH T0 00 header r=ffffff92 v=0 n=0 locates the timeout in the first SPI transfer, before protocol identification. No GENI register snapshot was visible in build 51." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 51; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Build 51 passed actual SPI read callback tests, v1/v2 protocol and contact/button/SPMI/GENI regressions, C/C++ compilation and original/compiled HID ABI checks. The matching image was temporarily booted; touch behavior and protocol status await observation." },
  { kind = "device", reference = "STAGE6.md", command = "Build-50 temporary boot; photo and user observation", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Lock screen after skipping Setup; short power presses switch the screen off/on, long press opens shutdown UI. Volume presses advance the key-report counter. Touch has no response: TouchComm start r=ffffffb9, n=0, raw value hidden by camera." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 50; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Build 50 passed actual HID descriptor parsing, TouchComm/contact/button/SPMI/GENI tests, C/C++ compilation and original/compiled HID ABI checks. The matching image was temporarily booted; touch/key response and KEYS/TOUCH rows await observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot stage7-run-49/boot.img; user observation", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Sending and Booting returned OKAY. The user reported no repeat panic during the test, while touch, volume/power keys and brightness remained unusable. Test duration was not specified; this does not qualify long-term stability or input." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/stage7-run-48/boot.img", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "Build 48 briefly reached the UI. Touch, volume/power keys and brightness did not respond; a UFS read timed out after 297989 reads. The screenshot shows one busy sample, elapsed time beyond the deadline and a later completed DMA snapshot. No partition was flashed." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40183635568", command = "test-peripherals.py; test-stage7.py; ./unixnu kernel -j 3", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "TouchComm, contact lifecycle, key debounce/failure, SPMI and GENI tests passed. The HID object passed ABI checks and the S3910/GENI sources compiled as C; all three objects linked into the prelinked kernel. Hardware input remains untested." },
  { kind = "source", reference = "drivers/PaganiInput/README.md", result = "Physical HID adapters, bounded TouchComm/SPMI paths, contact and key lifecycle tests; no hardware result claimed." },
]

