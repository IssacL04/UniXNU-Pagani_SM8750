[[area]]
id = "power"
status = "host-verified"
components = ["ShengPlatformPower"]
paths = ["patches/xnu/pagani-bootstrap.patch", "package/PaganiPeripherals.h"]
inputs = ["The component preserves the original Apple PMGR ABI and restricted boot-time operations."]
configuration = ["XNU_SHENG_PMGR=y; sheng-pmgr=2; sleep-disabled=1."]
